name: Testes automatizados Cypress

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Executar todos os testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Executar todos os testes Cypress
        uses: cypress-io/github-action@v7.4.3
        with:
          browser: electron

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-cypress
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
